<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#12392a;--deep:#0b261c;--leaf:#1d5a3b;--yolk:#ffc533;--paper:#fffdf5;--text:#f3f7ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;background:var(--deep);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font:400 17px/1.5 "Be Vietnam Pro",system-ui,sans-serif;
  background:radial-gradient(130% 55% at 50% 0,rgba(255,197,51,.30),rgba(255,197,51,0) 65%),linear-gradient(var(--forest),var(--deep)) fixed}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(120px + env(safe-area-inset-bottom))}
h1{margin:0 0 20px;text-align:center;font:800 clamp(2rem,10vw,3.4rem)/1.02 "Baloo 2","Be Vietnam Pro",system-ui,sans-serif;color:#fff;text-wrap:balance}
h1 span{display:block}
h1 .b{color:var(--yolk)}

.video{position:relative;aspect-ratio:16/9;margin:0 -16px;background:#000;border:solid var(--yolk);border-width:3px 0;box-shadow:0 0 60px rgba(255,197,51,.28)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (min-width:640px){
  main{padding-top:40px}
  .video{aspect-ratio:16/9;margin:0;border-width:4px;border-radius:22px;overflow:hidden}
}

#prices{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
#prices li{background:var(--paper);color:var(--forest);border-radius:22px;padding:16px 8px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
#prices li:last-child:nth-child(odd){grid-column:1/-1}
.name{font:700 clamp(1.15rem,5vw,1.5rem)/1.1 "Baloo 2",sans-serif;color:var(--leaf)}
.price{font:800 clamp(1.9rem,9vw,2.8rem)/1.1 "Baloo 2",sans-serif;color:var(--forest);background:var(--yolk);padding:2px 20px 4px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;word-break:break-word}

.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(11,38,28,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12)}
.zalo{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;max-width:688px;margin:0 auto;min-height:58px;background:var(--yolk);color:var(--forest);text-decoration:none;font:700 1.2rem "Be Vietnam Pro",sans-serif;border-radius:999px;transition:transform .15s}
.zalo:active{transform:scale(.97)}
.zalo svg{width:24px;height:24px;flex:none}
.zalo::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--yolk);animation:ring 2.8s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(1.08,1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.zalo::after{animation:none;display:none}}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
:root{--sh:linear-gradient(90deg,rgba(255,255,255,.07) 25%,rgba(255,255,255,.17) 50%,rgba(255,255,255,.07) 75%)}
.sk,#prices li.sk{background:var(--sh);background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
.sk-t{height:clamp(2rem,10vw,3.4rem);width:82%;margin:0 auto 10px}
.sk-t.s{width:58%}
.video.sk{background:var(--sh);background-size:200% 100%}
#prices li.sk{min-height:118px;border-radius:22px}
.err{margin:22px 0 0;padding:20px 16px;border-radius:22px;background:var(--paper);color:var(--forest);text-align:center;font-weight:700}
.err button{margin-top:12px;min-height:48px;padding:0 28px;border:0;border-radius:999px;background:var(--yolk);color:var(--forest);font:700 1.05rem "Be Vietnam Pro",sans-serif;cursor:pointer}
.zalo.is-off{opacity:.4;pointer-events:none}
.zalo.is-off::after{display:none}
@media (prefers-reduced-motion:reduce){.sk,#prices li.sk{animation:none}}
</style>
</head>
<body>
<main>
  <h1 id="title" aria-busy="true"><span class="sk sk-t"></span><span class="sk sk-t s"></span></h1>
  <div class="video sk" id="video"></div>
  <ul id="prices"><li class="sk"></li><li class="sk"></li></ul>
  <div class="err" id="err" role="alert" hidden>
    <div>Không tải được dữ liệu. Kiểm tra mạng rồi thử lại.</div>
    <button type="button" id="retry">Thử lại</button>
  </div>
</main>
<div class="bar">
  <a class="zalo is-off" id="zalo" aria-disabled="true" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 6 2 11c0 2.7 1.3 5.1 3.4 6.7L4.6 22l4.3-2.2c1 .3 2 .4 3.1.4 5.5 0 10-4 10-9S17.5 2 12 2z"/></svg>
    Đặt gà qua Zalo
  </a>
</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRQoqj_zBIPOybsRmR9H58ajvYOCIXAMriW_xmBCA6wibLyfLoawfUjhIfkPWx4vn4L0ZT5j8RS9UGG/pub?gid=945222915&single=true&output=csv";
const CACHE_KEY = "gtv:rows:v1";
const $ = id => document.getElementById(id);

function parseCSV(t){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
    else if(c!=="\r") cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toLowerCase().trim();
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;return e;};

function videoSrc(v){
  let m=v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  if(m) return "https://www.youtube-nocookie.com/embed/"+m[1]+"?rel=0&modestbranding=1&playsinline=1";
  m=v.match(/\/d\/([\w-]+)/)||v.match(/[?&]id=([\w-]+)/);
  if(m) return "https://drive.google.com/file/d/"+m[1]+"/preview";
  return "";
}

const SKELETON={title:$("title").innerHTML, prices:$("prices").innerHTML};
let shown=false;

function toRows(text){
  if(/^\s*</.test(text)) throw new Error("not csv");
  return parseCSV(text).slice(1).map(r=>[(r[0]||"").trim(),(r[1]||"").trim()]).filter(r=>r[0]&&r[1]);
}

function render(rows){
  let pageName="",title="",video="",zalo="";const items=[];
  for(const [key,val] of rows){
    const k=norm(key);
    if(k==="ten trang") pageName=val;
    else if(k==="tieu de") title=val;
    else if(k==="video") video=val;
    else if(k==="zalo") zalo=val;
    else items.push([key,val]);
  }

  const h=$("title"); h.textContent=""; h.removeAttribute("aria-busy");
  if(title){
    const parts=title.split(/\s+[-–—]\s+/);
    if(parts.length>1) h.append(el("span","",parts[0]), el("span","b",parts.slice(1).join(" - ")));
    else h.append(el("span","",title));
    h.hidden=false;
  } else h.hidden=true;
  if(pageName||title) document.title=pageName||title;

  const box=$("video"), old=box.querySelector("iframe"), src=videoSrc(video);
  box.classList.remove("sk");
  if(src){
    if(!old||old.getAttribute("src")!==src){
      if(old) old.remove();
      const f=document.createElement("iframe");
      f.src=src; f.title="Video đàn gà thả vườn"; f.allow="autoplay; fullscreen"; f.allowFullscreen=true;
      box.append(f);
    }
    box.hidden=false;
  } else { if(old) old.remove(); box.hidden=true; }

  const list=$("prices"); list.textContent="";
  for(const [name,price] of items){ const li=document.createElement("li"); li.append(el("span","name",name), el("span","price",price)); list.append(li); }
  list.hidden=!items.length;

  const digits=zalo.replace(/\D/g,""), a=$("zalo");
  if(digits){ a.href="https://zalo.me/"+digits; a.classList.remove("is-off"); a.removeAttribute("aria-disabled"); }
  else { a.removeAttribute("href"); a.classList.add("is-off"); a.setAttribute("aria-disabled","true"); }

  $("err").hidden=true; shown=true;
}

function showLoading(){
  $("err").hidden=true;
  const h=$("title"); h.innerHTML=SKELETON.title; h.hidden=false; h.setAttribute("aria-busy","true");
  const box=$("video"); const f=box.querySelector("iframe"); if(f) f.remove(); box.classList.add("sk"); box.hidden=false;
  const list=$("prices"); list.innerHTML=SKELETON.prices; list.hidden=false;
}
function showError(){
  $("title").hidden=true; $("video").hidden=true; $("prices").hidden=true; $("err").hidden=false;
}

async function load(){
  const ctrl=new AbortController(), timer=setTimeout(()=>ctrl.abort(),10000);
  try{
    const res=await fetch(SHEET_CSV_URL+"&t="+Date.now(),{signal:ctrl.signal});
    if(!res.ok) throw new Error("http "+res.status);
    const rows=toRows(await res.text());
    if(!rows.length) throw new Error("empty");
    render(rows);
    try{ localStorage.setItem(CACHE_KEY,JSON.stringify(rows)); }catch(e){}
  }catch(e){
    if(!shown) showError();
  }finally{ clearTimeout(timer); }
}

$("retry").addEventListener("click",()=>{ showLoading(); load(); });

try{
  const cached=JSON.parse(localStorage.getItem(CACHE_KEY));
  if(Array.isArray(cached)&&cached.length) render(cached);
}catch(e){}
load();
</script>
</body>
</html>
